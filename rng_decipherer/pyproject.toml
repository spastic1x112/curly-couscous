[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rng_decipherer"
version = "0.1.0"
description = "A tool to predict and crack PRNGs like MT19937 and LCG."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
rng-decipherer = "rng_decipherer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
